name: Update literature radar and deploy

on:
  push:
    branches: [main]
  workflow_dispatch:
  schedule:
    - cron: '0 8 * * *'
      timezone: 'Europe/Berlin'

permissions:
  contents: write
  pages: write
  id-token: write

concurrency:
  group: literature-radar-pages
  cancel-in-progress: true

jobs:
  build:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - name: Checkout
        uses: actions/checkout@v6

      - name: Set up Python
        if: github.event_name != 'push'
        uses: actions/setup-python@v6
        with:
          python-version: '3.12'
          cache: 'pip'

      - name: Install dependencies
        if: github.event_name != 'push'
        run: pip install -r requirements.txt

      - name: Update literature data
        if: github.event_name != 'push'
        env:
          OPENALEX_MAILTO: ${{ secrets.OPENALEX_MAILTO }}
          PYTHONUNBUFFERED: '1'
        run: python scripts/update_papers.py

      - name: Commit literature data
        if: github.event_name != 'push'
        run: |
          git config user.name "literature-radar-bot"
          git config user.email "actions@users.noreply.github.com"
          git add data/papers.json
          if ! git diff --cached --quiet; then
            git commit -m "chore: daily organic CO2 literature update [skip ci]"
            git push
          else
            echo "No data changes to commit."
          fi

      - name: Prepare static site
        run: |
          rm -rf _site
          mkdir -p _site/data
          cp index.html styles.css app.js _site/
          cp data/papers.json data/journal_metrics.json data/keywords.json _site/data/
          touch _site/.nojekyll

      - name: Configure Pages
        uses: actions/configure-pages@v6

      - name: Upload Pages artifact
        uses: actions/upload-pages-artifact@v5
        with:
          path: _site

  deploy:
    needs: build
    runs-on: ubuntu-latest
    permissions:
      pages: write
      id-token: write
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - name: Deploy to GitHub Pages
        id: deployment
        uses: actions/deploy-pages@v5
